name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 4 * * *' # Codziennie o 04:00 UTC
  workflow_dispatch: # Pozwala odpalić ręcznie w zakładce Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            curl -s -X GET "$SUPABASE_URL/rest/v1/intentions?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY"
            echo "Ping sent to Supabase API"
          else
            echo "Secrets not configured, skipping direct API ping"
          fi
